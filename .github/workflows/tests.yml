name: tests

on:
  push:
    branches:
      - feature/long-horizon-agent
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest pytest-asyncio pytest-mock ruff
      - name: Static checks
        run: ruff check --select E4,E7,E9,F nexus evals tests streamlit_app.py
      - name: Test
        run: pytest -q
      - name: Offline evaluation
        run: python evals/run.py
      - name: Package smoke check
        run: |
          python -m compileall -q nexus evals tests streamlit_app.py
          python -m pip install -e .
          aetheris --help

  container:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build portable API image
        run: docker build -f Dockerfile.api -t aetheris-api:ci .
