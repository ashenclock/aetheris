[project]
name = "aetheris"
version = "0.2.0"
description = "A lightweight, local-first, resumable coding agent"
authors = [
    {name = "Antonio", email = "antonio.spedito01@gmail.com"}
]
requires-python = ">=3.12,<3.14"
dependencies = [
    "typer (>=0.26.7,<0.27.0)",
    "rich (>=15.0.0,<16.0.0)",
    "litellm (>=1.89.3,<2.0.0)",
    "pydantic (>=2.13.4,<3.0.0)",
    "aiosqlite (>=0.22.1,<0.23.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
    "prompt-toolkit (>=3.0.52,<4.0.0)"
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-asyncio (>=1.4.0,<2.0.0)",
    "pytest-mock (>=3.15.1,<4.0.0)"
]
